[project]
name = "bot-bullet"
version = "0.1.0"
description = "捕获桌面截图，交给 DeepSeek 视觉模型生成描述"
readme = "README.md"
authors = [
    { name = "DirtyBottle", email = "479763003@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.17",
    "langchain-deepseek>=1.1.0",
    "mss>=10.2.0",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyside6>=6.11.2",
    "python-dotenv>=1.2.3",
    "rumps>=0.4.0",
]

[project.scripts]
bot-bullet = "bot_bullet.cli:main"
bot-bullet-tray = "bot_bullet.tray:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
